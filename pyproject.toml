[project]
name = "butler-home"
version = "0.1.0"
description = "Butler: a Telegram smart-home bot for Tuya / Smart Life plugs: schedules, natural language, voice, energy, Apple Watch"
requires-python = ">=3.11"
dependencies = [
    "tinytuya>=1.13",
    "apscheduler>=3.10,<4",
    "sqlalchemy>=2.0",
    "python-telegram-bot>=21.0",
    "typer>=0.12",
    "pydantic-settings>=2.2",
    "tzlocal>=5.2",
    "google-genai>=1.0",
    "cryptography>=50.0.2",
    "websocket-client>=1.9.2",
    "astral>=3.2",
    "aiohttp>=3.14.5",
]

[project.scripts]
butler = "butler.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["butler"]
